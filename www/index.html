<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Mono.Music</title>
  <style>
    :root {
      --bg-main: #000000;
      --bg-card: rgba(255, 255, 255, 0.05);
      --bg-card-hover: rgba(255, 255, 255, 0.12);
      --bg-glass: rgba(15, 15, 15, 0.88);
      --bg-glass-heavy: rgba(5, 5, 5, 0.95);
      
      --text-main: #ffffff;
      --text-sub: #888888;
      --border-glass: rgba(255, 255, 255, 0.15);
      
      --accent: #ffffff;
      --accent-invert: #000000;
      --glow: 0 0 20px rgba(255, 255, 255, 0.25);
      
      --radius-xl: 32px;
      --radius-lg: 20px;
      --radius-md: 14px;
    }

    body.theme-light {
      --bg-main: #ffffff;
      --bg-card: rgba(0, 0, 0, 0.04);
      --bg-card-hover: rgba(0, 0, 0, 0.08);
      --bg-glass: rgba(245, 245, 245, 0.88);
      --bg-glass-heavy: rgba(250, 250, 250, 0.95);
      
      --text-main: #000000;
      --text-sub: #666666;
      --border-glass: rgba(0, 0, 0, 0.12);
      
      --accent: #000000;
      --accent-invert: #ffffff;
      --glow: 0 4px 20px rgba(0, 0, 0, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background: var(--bg-main);
      color: var(--text-main);
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      transition: background 0.3s ease, color 0.3s ease;
    }

    .app-viewport {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      position: relative;
    }

    .top-bar {
      padding: 16px 20px;
      background: var(--bg-glass);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-bottom: 1px solid var(--border-glass);
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 10;
    }

    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -1px;
      text-transform: uppercase;
    }

    .theme-toggle-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-glass);
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: 30px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .search-wrap {
      position: relative;
      width: 100%;
    }

    .search-input {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border-glass);
      padding: 12px 16px 12px 42px;
      border-radius: var(--radius-lg);
      color: var(--text-main);
      font-size: 14px;
      outline: none;
    }

    .search-icon {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 15px;
      color: var(--text-sub);
    }

    .content-area {
      flex: 1;
      overflow-y: auto;
      padding: 20px 20px 190px 20px;
    }

    .section-head {
      font-size: 20px;
      font-weight: 800;
      margin: 16px 0 14px 0;
    }

    .btn-outline {
      background: transparent;
      color: var(--text-main);
      border: 1px solid var(--border-glass);
      padding: 10px 16px;
      border-radius: var(--radius-md);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .track-row {
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--bg-card);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-lg);
      padding: 12px 14px;
      margin-bottom: 10px;
      cursor: pointer;
    }
    .track-row.active {
      border-color: var(--text-main);
      box-shadow: var(--glow);
    }

    .row-cover { 
      width: 52px; 
      height: 52px; 
      border-radius: var(--radius-md); 
      object-fit: cover; 
      background: var(--bg-card-hover); 
      flex-shrink: 0;
    }
    .row-meta { flex: 1; min-width: 0; }
    .row-title { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row-artist { font-size: 12px; color: var(--text-sub); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .mini-player {
      position: fixed;
      bottom: 74px;
      left: 12px;
      right: 12px;
      height: 64px;
      background: var(--bg-glass-heavy);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border-radius: var(--radius-xl);
      border: 1px solid var(--border-glass);
      box-shadow: var(--glow);
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 12px;
      z-index: 90;
      cursor: pointer;
    }

    .mini-cover { 
      width: 44px; 
      height: 44px; 
      border-radius: var(--radius-md); 
      object-fit: cover; 
      flex-shrink: 0;
    }

    .play-btn-circle {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--accent);
      border: none;
      color: var(--accent-invert);
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .full-player {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: var(--bg-main);
      z-index: 200;
      display: flex;
      flex-direction: column;
      padding: 24px 20px;
      transform: translateY(100%);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .full-player.open { transform: translateY(0); }

    .fp-header { display: flex; justify-content: space-between; align-items: center; }
    
    .fp-cover-wrap { 
      width: 75vw; 
      max-width: 280px; 
      aspect-ratio: 1; 
      margin: 20px auto; 
      border-radius: var(--radius-xl); 
      overflow: hidden; 
      box-shadow: var(--glow);
      border: 1px solid var(--border-glass);
    }

    .fp-cover { width: 100%; height: 100%; object-fit: cover; }

    .fp-meta { text-align: center; margin-bottom: 16px; }
    .fp-title { font-size: 20px; font-weight: 900; margin-bottom: 4px; }
    .fp-artist { font-size: 14px; color: var(--text-sub); }

    .slider-range { 
      width: 100%; 
      -webkit-appearance: none; 
      height: 4px; 
      border-radius: 2px; 
      background: var(--border-glass); 
      outline: none;
      cursor: pointer;
    }
    .slider-range::-webkit-slider-thumb { 
      -webkit-appearance: none; 
      width: 16px; 
      height: 16px; 
      border-radius: 50%; 
      background: var(--accent); 
    }

    .time-labels { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-sub); margin-top: 8px; }

    .fp-controls { display: flex; justify-content: space-between; align-items: center; margin: 20px 0; }
    .fp-btn { background: none; border: none; color: var(--text-main); font-size: 22px; cursor: pointer; opacity: 0.8; }
    .fp-btn.active { opacity: 1; text-shadow: 0 0 10px var(--accent); }

    .bottom-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 66px;
      background: var(--bg-glass);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-top: 1px solid var(--border-glass);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      align-items: center;
      z-index: 100;
      padding-bottom: env(safe-area-inset-bottom);
    }

    .nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      color: var(--text-sub);
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
    }
    .nav-btn.active { color: var(--text-main); }
    .nav-btn span.nav-icon { font-size: 18px; line-height: 1; }

    .card-box {
      background: var(--bg-card);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-xl);
      padding: 24px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>

  <div class="app-viewport">
    <div class="top-bar">
      <div class="top-header">
        <div class="logo">Mono.Music</div>
        <button class="theme-toggle-btn" onclick="toggleTheme()">
          <span id="theme-icon">◐</span>
          <span id="theme-text">Тема</span>
        </button>
      </div>
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input class="search-input" id="search-bar" placeholder="Поиск по библиотеке..." oninput="handleSearch(this.value)">
      </div>
    </div>

    <div class="content-area" id="main-content"></div>

    <!-- Мини-плеер -->
    <div class="mini-player" id="mini-player" style="display:none;" onclick="openFullPlayer()">
      <img class="mini-cover" id="m-cover" src="" onerror="handleCoverError(this)">
      <div style="flex:1; min-width:0;">
        <div class="row-title" id="m-title">-</div>
        <div class="row-artist" id="m-artist">-</div>
      </div>
      <button class="play-btn-circle" id="m-play-btn" onclick="event.stopPropagation(); togglePlay()">▶</button>
    </div>

    <div class="bottom-bar" id="bottom-bar"></div>
  </div>

  <!-- Полноэкранный плеер -->
  <div class="full-player" id="full-player">
    <div class="fp-header">
      <button class="fp-btn" onclick="closeFullPlayer()">✕</button>
      <div style="font-size:12px; font-weight:800; letter-spacing:1.5px; opacity:0.6;">WEB AUDIO</div>
      <button class="fp-btn" id="fp-fav-btn" onclick="toggleFavCurrent()">♡</button>
    </div>
    
    <div class="fp-cover-wrap">
      <img class="fp-cover" id="fp-cover" src="" onerror="handleCoverError(this)">
    </div>

    <div class="fp-meta">
      <div class="fp-title" id="fp-title">-</div>
      <div class="fp-artist" id="fp-artist">-</div>
    </div>

    <div style="padding: 0 10px;">
      <input type="range" class="slider-range" id="fp-progress" value="0" min="0" max="100" oninput="seekAudio(this.value)">
      <div class="time-labels">
        <span id="fp-curr-time">0:00</span>
        <span id="fp-dur-time">0:00</span>
      </div>
    </div>

    <div class="fp-controls">
      <button class="fp-btn" id="btn-shuffle" onclick="toggleShuffle()">🔀</button>
      <button class="fp-btn" onclick="prevTrack()">⏮</button>
      <button class="play-btn-circle" style="width:60px; height:60px; font-size:22px;" id="fp-play-btn" onclick="togglePlay()">▶</button>
      <button class="fp-btn" onclick="nextTrack()">⏭</button>
      <button class="fp-btn" id="btn-repeat" onclick="toggleRepeat()">🔁</button>
    </div>
  </div>

  <script>
    const audio = new Audio();
    audio.crossOrigin = "anonymous";

    const BASE_URL = 'https://ws117.web1.websitegame.ru/assets/';
    const JSON_URL = BASE_URL + 'tracks.json';
    const FALLBACK_COVER = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><rect width="100" height="100" fill="%23222"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="%23fff" font-size="30">🎵</text></svg>';

    let appState = {
      currentTab: 'home',
      currentTrack: null,
      isPlaying: false,
      searchQuery: '',
      isShuffle: false,
      repeatMode: 0,
      theme: localStorage.getItem('mono_theme') || 'dark',
      favorites: JSON.parse(localStorage.getItem('mono_favs')) || [],
      tracks: []
    };

    if (appState.theme === 'light') document.body.classList.add('theme-light');

    async function loadCustomServerTracks() {
      try {
        const res = await fetch(JSON_URL);
        if (res.ok) {
          const trackNames = await res.json();
          
          appState.tracks = trackNames.map((fileName, idx) => {
            let artist = 'Неизвестный исполнитель';
            let title = fileName.replace(/_/g, ' ');

            if (title.includes(' - ')) {
              const parts = title.split(' - ');
              artist = parts[0].trim();
              title = parts.slice(1).join(' - ').trim();
            }

            const encodedName = encodeURIComponent(fileName);

            return {
              id: 'srv_' + idx,
              title: title,
              artist: artist,
              src: BASE_URL + encodedName + '.mp3',
              cover: BASE_URL + encodedName + '.png'
            };
          });
        }
      } catch (e) {
        console.error('Ошибка загрузки треков с вашего сервера:', e);
      }
      render();
    }

    function handleCoverError(img) { 
      if (img.src.endsWith('.png')) {
        img.src = img.src.slice(0, -4) + '.jpg';
      } else {
        img.src = FALLBACK_COVER; 
      }
    }

    function toggleTheme() {
      appState.theme = appState.theme === 'dark' ? 'light' : 'dark';
      localStorage.setItem('mono_theme', appState.theme);
      if (appState.theme === 'light') document.body.classList.add('theme-light');
      else document.body.classList.remove('theme-light');
      render();
    }

    function handleSearch(val) {
      appState.searchQuery = val.toLowerCase().trim();
      render();
    }

    function render() {
      const view = document.getElementById('main-content');
      
      document.getElementById('theme-icon').textContent = appState.theme === 'dark' ? '◑' : '◐';
      document.getElementById('theme-text').textContent = appState.theme === 'dark' ? 'Светлая' : 'Тёмная';

      document.getElementById('bottom-bar').innerHTML = `
        <div class="nav-btn ${appState.currentTab === 'home' ? 'active' : ''}" onclick="switchTab('home')">
          <span class="nav-icon">⚡</span>
          <span>Главная</span>
        </div>
        <div class="nav-btn ${appState.currentTab === 'favs' ? 'active' : ''}" onclick="switchTab('favs')">
          <span class="nav-icon">🖤</span>
          <span>Избранное</span>
        </div>
        <div class="nav-btn ${appState.currentTab === 'guide' ? 'active' : ''}" onclick="switchTab('guide')">
          <span class="nav-icon">☁️</span>
          <span>Инфо</span>
        </div>
      `;

      let filteredTracks = appState.tracks.filter(t => 
        t.title.toLowerCase().includes(appState.searchQuery) || 
        t.artist.toLowerCase().includes(appState.searchQuery)
      );

      if (appState.currentTab === 'home') {
        view.innerHTML = `<div class="section-head">Треки с сервера (${filteredTracks.length})</div>${renderTrackRows(filteredTracks)}`;
      } 
      else if (appState.currentTab === 'favs') {
        const favs = filteredTracks.filter(t => appState.favorites.includes(t.id));
        view.innerHTML = `<div class="section-head">Избранное (${favs.length})</div>${renderTrackRows(favs)}`;
      }
      else if (appState.currentTab === 'guide') {
        view.innerHTML = `
          <div class="card-box">
            <h2 style="margin-bottom:10px;">☁️ Ваш сервер</h2>
            <p style="color:var(--text-sub); font-size:13px; line-height:1.5; margin-bottom:12px;">
              Файлы подгружаются с <b>ws117.web1.websitegame.ru</b>
            </p>
            <p style="color:var(--text-sub); font-size:12px;">
              Чтобы добавить трек, загрузите в папку <code>assets</code> файлы MP3 и PNG, а затем добавьте имя в <code>tracks.json</code>.
            </p>
          </div>
        `;
      }
    }

    function renderTrackRows(list) {
      if (!list.length) return `<div style="color:var(--text-sub); text-align:center; padding:40px;">Ничего не найдено</div>`;
      return list.map(t => `
        <div class="track-row ${appState.currentTrack && appState.currentTrack.id === t.id ? 'active' : ''}" onclick="playTrack('${t.id}')">
          <img class="row-cover" src="${t.cover}" onerror="handleCoverError(this)">
          <div class="row-meta">
            <div class="row-title">${t.title}</div>
            <div class="row-artist">${t.artist}</div>
          </div>
          <button class="btn-outline" style="border:none; padding:8px;" onclick="event.stopPropagation(); toggleFav('${t.id}')">
            ${appState.favorites.includes(t.id) ? '🖤' : '♡'}
          </button>
        </div>
      `).join('');
    }

    function playTrack(id) {
      const t = appState.tracks.find(x => x.id === id);
      if (!t) return;
      
      appState.currentTrack = t;
      audio.src = t.src;
      
      audio.play().then(() => {
        appState.isPlaying = true;
        updatePlayerUI();
      }).catch(e => console.log(e));
    }

    function togglePlay() {
      if (!appState.currentTrack && appState.tracks.length) return playTrack(appState.tracks[0].id);
      if (!appState.currentTrack) return;

      if (appState.isPlaying) { audio.pause(); appState.isPlaying = false; }
      else { audio.play(); appState.isPlaying = true; }
      updatePlayerUI();
    }

    function nextTrack() {
      if (!appState.tracks.length) return;
      if (appState.isShuffle) {
        const randomIdx = Math.floor(Math.random() * appState.tracks.length);
        return playTrack(appState.tracks[randomIdx].id);
      }
      const idx = appState.tracks.findIndex(t => t.id === (appState.currentTrack ? appState.currentTrack.id : ''));
      playTrack(appState.tracks[(idx + 1) % appState.tracks.length].id);
    }

    function prevTrack() {
      if (!appState.tracks.length) return;
      const idx = appState.tracks.findIndex(t => t.id === (appState.currentTrack ? appState.currentTrack.id : ''));
      playTrack(appState.tracks[(idx - 1 + appState.tracks.length) % appState.tracks.length].id);
    }

    function toggleShuffle() {
      appState.isShuffle = !appState.isShuffle;
      document.getElementById('btn-shuffle').classList.toggle('active', appState.isShuffle);
    }

    function toggleRepeat() {
      appState.repeatMode = (appState.repeatMode + 1) % 2;
      document.getElementById('btn-repeat').classList.toggle('active', appState.repeatMode === 1);
    }

    function updatePlayerUI() {
      if (!appState.currentTrack) return;
      document.getElementById('mini-player').style.display = 'flex';
      document.getElementById('m-cover').src = appState.currentTrack.cover;
      document.getElementById('m-title').textContent = appState.currentTrack.title;
      document.getElementById('m-artist').textContent = appState.currentTrack.artist;
      document.getElementById('m-play-btn').textContent = appState.isPlaying ? '⏸' : '▶';

      document.getElementById('fp-cover').src = appState.currentTrack.cover;
      document.getElementById('fp-title').textContent = appState.currentTrack.title;
      document.getElementById('fp-artist').textContent = appState.currentTrack.artist;
      document.getElementById('fp-play-btn').textContent = appState.isPlaying ? '⏸' : '▶';

      const favBtn = document.getElementById('fp-fav-btn');
      favBtn.textContent = appState.favorites.includes(appState.currentTrack.id) ? '🖤' : '♡';

      render();
    }

    audio.ontimeupdate = () => {
      if (!audio.duration) return;
      document.getElementById('fp-progress').value = (audio.currentTime / audio.duration) * 100;
      document.getElementById('fp-curr-time').textContent = formatTime(audio.currentTime);
      document.getElementById('fp-dur-time').textContent = formatTime(audio.duration);
    };

    audio.onended = () => {
      if (appState.repeatMode === 1) { audio.currentTime = 0; audio.play(); }
      else { nextTrack(); }
    };

    function seekAudio(v) { if (audio.duration) audio.currentTime = (v / 100) * audio.duration; }
    function formatTime(s) { const m = Math.floor(s/60), sec = Math.floor(s%60); return `${m}:${sec<10?'0':''}${sec}`; }

    function openFullPlayer() { document.getElementById('full-player').classList.add('open'); }
    function closeFullPlayer() { document.getElementById('full-player').classList.remove('open'); }

    function toggleFav(id) {
      const idx = appState.favorites.indexOf(id);
      if (idx > -1) appState.favorites.splice(idx, 1);
      else appState.favorites.push(id);
      localStorage.setItem('mono_favs', JSON.stringify(appState.favorites));
      render();
    }
    function toggleFavCurrent() { if (appState.currentTrack) toggleFav(appState.currentTrack.id); }

    function switchTab(t) { appState.currentTab = t; render(); }

    loadCustomServerTracks();
  </script>
</body>
</html>
