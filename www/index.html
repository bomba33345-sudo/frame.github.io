<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#030014">
  <title>Mono.Music</title>
  <style>
    :root {
      --bg-dark: #02000a;
      --bg-glass: rgba(12, 10, 32, 0.75);
      --bg-glass-heavy: rgba(8, 6, 22, 0.92);
      --bg-card: rgba(255, 255, 255, 0.035);
      --accent-cyan: #00f2fe;
      --accent-purple: #7f00ff;
      --neon-cyan: 0 0 20px rgba(0, 242, 254, 0.6);
      --text-main: #ffffff;
      --text-sub: #9ca3af;
      --border-glass: rgba(255, 255, 255, 0.12);
      --radius-xl: 32px;
      --radius-lg: 20px;
      --radius-md: 14px;
      --ease-spring: cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background: var(--bg-dark);
      color: var(--text-main);
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    .app-viewport {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
    }

    .top-bar {
      padding: 16px 20px;
      background: var(--bg-glass);
      backdrop-filter: blur(30px);
      border-bottom: 1px solid var(--border-glass);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .logo {
      font-size: 20px;
      font-weight: 900;
      background: linear-gradient(135deg, #fff, var(--accent-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .user-pill {
      font-size: 12px;
      font-weight: 700;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border-glass);
      padding: 8px 16px;
      border-radius: 30px;
      cursor: pointer;
    }

    .content-area {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      padding-bottom: 180px;
    }

    .section-head {
      font-size: 18px;
      font-weight: 800;
      margin: 18px 0 12px 0;
    }

    .track-row {
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--bg-card);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-lg);
      padding: 10px 14px;
      margin-bottom: 10px;
      cursor: pointer;
    }
    .track-row.active {
      border-color: var(--accent-cyan);
      box-shadow: var(--neon-cyan);
    }
    .row-cover { width: 50px; height: 50px; border-radius: var(--radius-md); object-fit: cover; background: #111; }
    .row-meta { flex: 1; min-width: 0; }
    .row-title { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row-artist { font-size: 12px; color: var(--text-sub); margin-top: 3px; }

    .mini-player {
      position: fixed;
      bottom: 75px;
      left: 12px;
      right: 12px;
      height: 68px;
      background: rgba(18, 18, 22, 0.95);
      backdrop-filter: blur(30px);
      border-radius: 22px;
      border: 1px solid var(--border-glass);
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 12px;
      z-index: 90;
      cursor: pointer;
    }
    .mini-cover { width: 48px; height: 48px; border-radius: 14px; object-fit: cover; background: #111; }
    .play-circle {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
      border: none;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 65px;
      background: var(--bg-glass);
      backdrop-filter: blur(30px);
      border-top: 1px solid var(--border-glass);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
    }
    .nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--text-sub);
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
    }
    .nav-btn.active { color: var(--accent-cyan); }
    .nav-btn span { font-size: 18px; }

    /* Полноэкранный плеер */
    .full-player {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #121214;
      z-index: 200;
      display: flex;
      flex-direction: column;
      padding: 24px;
      transform: translateY(100%);
      transition: transform 0.4s ease;
    }
    .full-player.open { transform: translateY(0); }

    .fp-header { display: flex; justify-content: space-between; align-items: center; }
    .fp-cover-wrap { width: 80vw; max-width: 300px; aspect-ratio: 1; margin: 30px auto; border-radius: 20px; overflow: hidden; }
    .fp-cover { width: 100%; height: 100%; object-fit: cover; background: #222; }

    .fp-meta { text-align: center; margin-bottom: 20px; }
    .fp-title { font-size: 22px; font-weight: 800; }
    .fp-artist { font-size: 14px; color: var(--text-sub); margin-top: 4px; }

    .time-slider { width: 100%; -webkit-appearance: none; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.2); }
    .time-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: #fff; }

    .time-labels { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-sub); margin-top: 8px; }

    .fp-controls { display: flex; justify-content: center; align-items: center; gap: 24px; margin: 20px 0; }
    .fp-btn { background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; }

    /* Админка и Формы */
    .auth-card {
      background: var(--bg-glass-heavy);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-xl);
      padding: 24px;
      max-width: 400px;
      margin: 20px auto;
    }
    .cyber-input {
      width: 100%;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border-glass);
      padding: 12px;
      border-radius: var(--radius-md);
      color: #fff;
      font-size: 14px;
      margin-bottom: 12px;
      outline: none;
    }
    .cyber-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
      border: none;
      border-radius: var(--radius-md);
      color: #fff;
      font-weight: 800;
      cursor: pointer;
    }
    .admin-badge {
      background: #ff007f;
      color: #fff;
      padding: 2px 6px;
      border-radius: 6px;
      font-size: 10px;
      margin-left: 6px;
    }
  </style>
</head>
<body>

  <div class="app-viewport">
    <div class="top-bar">
      <div class="logo">Mono.Music</div>
      <div class="user-pill" id="user-pill" onclick="switchTab('auth')">👤 Войти</div>
    </div>

    <div class="content-area" id="main-content"></div>

    <!-- Мини-плеер -->
    <div class="mini-player" id="mini-player" style="display:none;" onclick="openFullPlayer()">
      <img class="mini-cover" id="m-cover" src="" onerror="handleCoverError(this)">
      <div style="flex:1; min-width:0;">
        <div style="font-size:13px; font-weight:700;" id="m-title">-</div>
        <div style="font-size:11px; color:var(--text-sub);" id="m-artist">-</div>
      </div>
      <button class="play-circle" id="m-play-btn" onclick="event.stopPropagation(); togglePlay()">▶</button>
    </div>

    <!-- Навигация -->
    <div class="bottom-bar" id="bottom-bar">
      <div class="nav-btn active" data-tab="home" onclick="switchTab('home')"><span>⚡</span>Главная</div>
      <div class="nav-btn" data-tab="favs" onclick="switchTab('favs')"><span>❤️</span>Избранное</div>
      <div class="nav-btn" data-tab="auth" onclick="switchTab('auth')"><span>👤</span>Профиль</div>
    </div>
  </div>

  <!-- Полноэкранный плеер -->
  <div class="full-player" id="full-player">
    <div class="fp-header">
      <button class="fp-btn" onclick="closeFullPlayer()">✕</button>
      <div style="font-size:12px; font-weight:700; color:var(--text-sub);">СЕЙЧАС ИГРАЕТ</div>
      <button class="fp-btn" id="fp-fav-btn" onclick="toggleFavCurrent()">♡</button>
    </div>
    
    <div class="fp-cover-wrap">
      <img class="fp-cover" id="fp-cover" src="" onerror="handleCoverError(this)">
    </div>

    <div class="fp-meta">
      <div class="fp-title" id="fp-title">-</div>
      <div class="fp-artist" id="fp-artist">-</div>
    </div>

    <div>
      <input type="range" class="time-slider" id="fp-progress" value="0" min="0" max="100" oninput="seekAudio(this.value)">
      <div class="time-labels">
        <span id="fp-curr-time">0:00</span>
        <span id="fp-dur-time">0:00</span>
      </div>
    </div>

    <div class="fp-controls">
      <button class="fp-btn" onclick="prevTrack()">⏮</button>
      <button class="play-circle" style="width:60px; height:60px;" id="fp-play-btn" onclick="togglePlay()">▶</button>
      <button class="fp-btn" onclick="nextTrack()">⏭</button>
    </div>
  </div>

  <script>
    const audio = new Audio();

    // GitHub Конфигурация
    const GITHUB_USER = 'bomba33345-sudo';
    const GITHUB_REPO = 'frame.github.io';
    const GITHUB_RAW_BASE = `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main/assets/`;
    const GITHUB_API_URL = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/assets`;

    // Запасные аватарки для обложек, если файла обложки нет на GitHub
    const FALLBACK_COVER = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><rect width="100" height="100" fill="%237f00ff"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="%2300f2fe" font-size="30">🎵</text></svg>';

    let appState = {
      user: JSON.parse(localStorage.getItem('mono_user')) || null,
      currentTab: 'home',
      currentTrack: null,
      isPlaying: false,
      favorites: JSON.parse(localStorage.getItem('mono_favs')) || [],
      tracks: []
    };

    // Функция поиска картинок (.png, .jpg, .webp)
    function getCoverVariants(baseName) {
      return [
        GITHUB_RAW_BASE + baseName + '.png',
        GITHUB_RAW_BASE + baseName + '.jpg',
        GITHUB_RAW_BASE + baseName + '.jpeg',
        GITHUB_RAW_BASE + baseName + '.webp'
      ];
    }

    // Обработка ошибки загрузки обложки (перебор расширений -> фоллбек)
    function handleCoverError(imgElement) {
      const attempts = parseInt(imgElement.getAttribute('data-attempt') || '0');
      const baseName = imgElement.getAttribute('data-basename');
      
      if (baseName) {
        const variants = getCoverVariants(baseName);
        if (attempts < variants.length - 1) {
          imgElement.setAttribute('data-attempt', attempts + 1);
          imgElement.src = variants[attempts + 1];
          return;
        }
      }
      imgElement.src = FALLBACK_COVER;
    }

    // Авто-загрузка файлов из GitHub API
    async function loadTracksFromGitHub() {
      try {
        const res = await fetch(GITHUB_API_URL);
        if (!res.ok) throw new Error('API Error');
        const files = await res.json();
        
        const audioFiles = files.filter(f => f.name.endsWith('.mp3') || f.name.endsWith('.wav'));
        
        if (audioFiles.length > 0) {
          appState.tracks = audioFiles.map((file, idx) => {
            const baseName = file.name.substring(0, file.name.lastIndexOf('.'));
            return {
              id: String(idx + 1),
              title: baseName.replace(/_/g, ' '),
              artist: 'GitHub Track',
              src: file.download_url,
              baseName: baseName,
              cover: GITHUB_RAW_BASE + baseName + '.png' // По умолчанию запрашиваем PNG
            };
          });
        }
      } catch (e) {
        console.warn("Ошибка подгрузки с GitHub API. Используются локальные данные.");
      }
      render();
    }

    function render() {
      const view = document.getElementById('main-content');
      const userPill = document.getElementById('user-pill');
      
      if (appState.user) {
        userPill.innerHTML = `👤 ${appState.user.name} ${appState.user.isAdmin ? '<span class="admin-badge">ADMIN</span>' : ''}`;
      } else {
        userPill.textContent = '👤 Войти';
      }

      // Обновляем панель навигации (показываем кнопку админки если admin)
      const bottomBar = document.getElementById('bottom-bar');
      bottomBar.innerHTML = `
        <div class="nav-btn ${appState.currentTab === 'home' ? 'active' : ''}" onclick="switchTab('home')"><span>⚡</span>Главная</div>
        <div class="nav-btn ${appState.currentTab === 'favs' ? 'active' : ''}" onclick="switchTab('favs')"><span>❤️</span>Избранное</div>
        ${appState.user && appState.user.isAdmin ? `<div class="nav-btn ${appState.currentTab === 'admin' ? 'active' : ''}" onclick="switchTab('admin')"><span>⚙️</span>Админка</div>` : ''}
        <div class="nav-btn ${appState.currentTab === 'auth' ? 'active' : ''}" onclick="switchTab('auth')"><span>👤</span>Профиль</div>
      `;

      if (appState.currentTab === 'home') {
        view.innerHTML = `
          <div class="section-head">Все треки (${appState.tracks.length})</div>
          ${renderTrackRows(appState.tracks)}
        `;
      } 
      else if (appState.currentTab === 'auth') {
        if (appState.user) {
          view.innerHTML = `
            <div class="auth-card">
              <h2 style="margin-bottom:12px;">Профиль: ${appState.user.name}</h2>
              <p style="color:var(--text-sub); font-size:13px; margin-bottom:20px;">Роль: ${appState.user.isAdmin ? 'Администратор' : 'Пользователь'}</p>
              <button class="cyber-btn" style="background:#ff007f;" onclick="logout()">Выйти</button>
            </div>
          `;
        } else {
          view.innerHTML = `
            <div class="auth-card">
              <h2 style="margin-bottom:16px; text-align:center;">Авторизация</h2>
              <input class="cyber-input" id="auth-name" placeholder="Логин (например: admin)">
              <input class="cyber-input" type="password" id="auth-pass" placeholder="Пароль (например: admin123)">
              <button class="cyber-btn" onclick="login()">Войти</button>
            </div>
          `;
        }
      }
      else if (appState.currentTab === 'admin') {
        view.innerHTML = `
          <div class="auth-card" style="max-width:100%;">
            <h2>⚙️ Панель администратора</h2>
            <p style="color:var(--text-sub); font-size:12px; margin: 10px 0 20px 0;">Добавление новых треков напрямую в список:</p>
            
            <input class="cyber-input" id="adm-title" placeholder="Название трека">
            <input class="cyber-input" id="adm-artist" placeholder="Исполнитель">
            <input class="cyber-input" id="adm-src" placeholder="Прямая ссылка на MP3/WAV">
            <input class="cyber-input" id="adm-cover" placeholder="Ссылка на обложку (PNG/JPG)">
            
            <button class="cyber-btn" onclick="adminAddTrack()">Добавить трек</button>
          </div>
        `;
      }
      else if (appState.currentTab === 'favs') {
        const favList = appState.tracks.filter(t => appState.favorites.includes(t.id));
        view.innerHTML = `<div class="section-head">Избранное (${favList.length})</div>${renderTrackRows(favList)}`;
      }
    }

    function renderTrackRows(list) {
      if (!list.length) return `<div style="color:var(--text-sub); padding:30px; text-align:center;">Список пуст</div>`;
      return list.map(t => `
        <div class="track-row ${appState.currentTrack && appState.currentTrack.id === t.id ? 'active' : ''}" onclick="playTrack('${t.id}')">
          <img class="row-cover" src="${t.cover}" data-basename="${t.baseName || ''}" data-attempt="0" onerror="handleCoverError(this)">
          <div class="row-meta">
            <div class="row-title">${t.title}</div>
            <div class="row-artist">${t.artist}</div>
          </div>
          <button style="background:none; border:none; color:#fff;" onclick="event.stopPropagation(); toggleFav('${t.id}')">
            ${appState.favorites.includes(t.id) ? '❤️' : '♡'}
          </button>
        </div>
      `).join('');
    }

    /* ПЛЕЕР */
    function playTrack(id) {
      const t = appState.tracks.find(x => x.id === id); 
      if (!t) return;
      appState.currentTrack = t;
      audio.src = t.src;
      audio.play().then(() => {
        appState.isPlaying = true;
        updatePlayerUI();
      }).catch(e => console.log("Ошибка воспроизведения"));
    }

    function togglePlay() {
      if (!appState.currentTrack && appState.tracks.length) return playTrack(appState.tracks[0].id);
      if (appState.isPlaying) { audio.pause(); appState.isPlaying = false; } 
      else { audio.play(); appState.isPlaying = true; }
      updatePlayerUI();
    }

    function nextTrack() {
      if (!appState.currentTrack) return;
      const idx = appState.tracks.findIndex(t => t.id === appState.currentTrack.id);
      playTrack(appState.tracks[(idx + 1) % appState.tracks.length].id);
    }

    function prevTrack() {
      if (!appState.currentTrack) return;
      const idx = appState.tracks.findIndex(t => t.id === appState.currentTrack.id);
      playTrack(appState.tracks[(idx - 1 + appState.tracks.length) % appState.tracks.length].id);
    }

    function updatePlayerUI() {
      if (!appState.currentTrack) return;
      document.getElementById('mini-player').style.display = 'flex';
      
      const mCover = document.getElementById('m-cover');
      mCover.setAttribute('data-basename', appState.currentTrack.baseName || '');
      mCover.setAttribute('data-attempt', '0');
      mCover.src = appState.currentTrack.cover;

      document.getElementById('m-title').textContent = appState.currentTrack.title;
      document.getElementById('m-artist').textContent = appState.currentTrack.artist;
      document.getElementById('m-play-btn').textContent = appState.isPlaying ? '⏸' : '▶';

      const fpCover = document.getElementById('fp-cover');
      fpCover.setAttribute('data-basename', appState.currentTrack.baseName || '');
      fpCover.setAttribute('data-attempt', '0');
      fpCover.src = appState.currentTrack.cover;

      document.getElementById('fp-title').textContent = appState.currentTrack.title;
      document.getElementById('fp-artist').textContent = appState.currentTrack.artist;
      document.getElementById('fp-play-btn').textContent = appState.isPlaying ? '⏸' : '▶';
      document.getElementById('fp-fav-btn').textContent = appState.favorites.includes(appState.currentTrack.id) ? '❤️' : '♡';

      render();
    }

    /* АВТОРИЗАЦИЯ ДЛЯ ТЕСТ УЗЕРА ADMIN / ADMIN123 */
    function login() {
      const userVal = document.getElementById('auth-name').value.trim();
      const passVal = document.getElementById('auth-pass').value.trim();

      if (!userVal) return alert('Введите имя!');

      const isAdmin = (userVal === 'admin' && passVal === 'admin123');

      appState.user = { name: userVal, isAdmin: isAdmin };
      localStorage.setItem('mono_user', JSON.stringify(appState.user));
      render();
    }

    function logout() {
      appState.user = null;
      localStorage.removeItem('mono_user');
      switchTab('home');
    }

    function adminAddTrack() {
      const title = document.getElementById('adm-title').value.trim();
      const artist = document.getElementById('adm-artist').value.trim() || 'Admin';
      const src = document.getElementById('adm-src').value.trim();
      const cover = document.getElementById('adm-cover').value.trim();

      if (!title || !src) return alert('Укажите название и ссылку на mp3');

      const newTrack = {
        id: String(Date.now()),
        title,
        artist,
        src,
        cover: cover || FALLBACK_COVER
      };

      appState.tracks.unshift(newTrack);
      alert('Трек успешно добавлен в список!');
      switchTab('home');
    }

    audio.ontimeupdate = () => {
      if (!audio.duration) return;
      document.getElementById('fp-progress').value = (audio.currentTime / audio.duration) * 100;
      document.getElementById('fp-curr-time').textContent = formatTime(audio.currentTime);
      document.getElementById('fp-dur-time').textContent = formatTime(audio.duration);
    };

    function seekAudio(val) {
      if (audio.duration) audio.currentTime = (val / 100) * audio.duration;
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function openFullPlayer() { document.getElementById('full-player').classList.add('open'); }
    function closeFullPlayer() { document.getElementById('full-player').classList.remove('open'); }

    function toggleFav(id) {
      const idx = appState.favorites.indexOf(id);
      if (idx > -1) appState.favorites.splice(idx, 1);
      else appState.favorites.push(id);
      localStorage.setItem('mono_favs', JSON.stringify(appState.favorites));
      render();
    }

    function toggleFavCurrent() {
      if (appState.currentTrack) toggleFav(appState.currentTrack.id);
    }

    function switchTab(tab) {
      appState.currentTab = tab;
      render();
    }

    loadTracksFromGitHub();
  </script>
</body>
</html>
