<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Mono.Music</title>
  <style>
    :root {
      --bg-dark: #000000;
      --bg-glass: rgba(18, 18, 18, 0.85);
      --bg-glass-heavy: rgba(10, 10, 10, 0.95);
      --bg-card: rgba(255, 255, 255, 0.05);
      --bg-card-hover: rgba(255, 255, 255, 0.1);
      
      --accent-color: #ffffff;
      --accent-dim: #888888;
      --accent-grad: linear-gradient(135deg, #ffffff 0%, #aaaaaa 100%);
      
      --glow-effect: 0 0 20px rgba(255, 255, 255, 0.2);
      
      --text-main: #ffffff;
      --text-sub: #888888;
      --border-glass: rgba(255, 255, 255, 0.12);
      
      --radius-xl: 28px;
      --radius-lg: 18px;
      --radius-md: 12px;
      --radius-sm: 8px;
    }

    body.theme-cyber {
      --bg-dark: #030014;
      --bg-glass: rgba(15, 12, 41, 0.8);
      --bg-glass-heavy: rgba(10, 8, 30, 0.95);
      --accent-color: #00f2fe;
      --accent-dim: #ff007f;
      --accent-grad: linear-gradient(135deg, #00f2fe 0%, #7f00ff 50%, #ff007f 100%);
      --glow-effect: 0 0 25px rgba(0, 242, 254, 0.4);
      --text-sub: #a0a5c0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background: var(--bg-dark);
      color: var(--text-main);
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      transition: background 0.4s ease;
    }

    .app-viewport {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      position: relative;
    }

    .top-bar {
      padding: 14px 18px;
      background: var(--bg-glass);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border-bottom: 1px solid var(--border-glass);
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 10;
    }

    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -0.5px;
      background: var(--accent-grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: pulseLogo 3s infinite alternate;
    }

    @keyframes pulseLogo {
      0% { opacity: 0.8; }
      100% { opacity: 1; filter: drop-shadow(var(--glow-effect)); }
    }

    .search-wrap {
      position: relative;
      width: 100%;
    }

    .search-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-glass);
      padding: 10px 16px 10px 38px;
      border-radius: 30px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .search-input:focus {
      background: rgba(0, 0, 0, 0.8);
      border-color: var(--accent-color);
      box-shadow: var(--glow-effect);
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
      color: var(--text-sub);
    }

    .user-pill {
      font-size: 12px;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-glass);
      padding: 6px 14px;
      border-radius: 30px;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .user-pill:active { transform: scale(0.95); }

    .content-area {
      flex: 1;
      overflow-y: auto;
      padding: 16px 18px 180px 18px;
      scroll-behavior: smooth;
    }

    .section-head {
      font-size: 18px;
      font-weight: 800;
      margin: 14px 0 12px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      letter-spacing: -0.3px;
    }

    .track-row {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg-card);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-lg);
      padding: 10px 12px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .track-row:active {
      transform: scale(0.97);
      background: var(--bg-card-hover);
    }
    .track-row.active {
      border-color: var(--accent-color);
      box-shadow: var(--glow-effect);
      background: rgba(255, 255, 255, 0.1);
    }

    .row-cover { 
      width: 48px; 
      height: 48px; 
      border-radius: var(--radius-md); 
      object-fit: cover; 
      background: #111; 
      flex-shrink: 0;
    }
    .row-meta { flex: 1; min-width: 0; }
    .row-title { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
    .row-artist { font-size: 12px; color: var(--text-sub); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .icon-btn {
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 16px;
      padding: 8px;
      cursor: pointer;
      border-radius: 50%;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon-btn:active { transform: scale(0.8); color: var(--accent-color); }
    .icon-btn.active { color: var(--accent-dim); }

    .mini-player {
      position: fixed;
      bottom: 74px;
      left: 10px;
      right: 10px;
      height: 64px;
      background: var(--bg-glass-heavy);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-glass);
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 12px;
      z-index: 90;
      cursor: pointer;
      animation: slideUp 0.3s ease;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .mini-cover { 
      width: 44px; 
      height: 44px; 
      border-radius: var(--radius-md); 
      object-fit: cover; 
      background: #111; 
      flex-shrink: 0;
    }

    .play-circle {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--accent-grad);
      border: none;
      color: #000;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      box-shadow: var(--glow-effect);
    }
    .play-circle:active { transform: scale(0.9); }

    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 64px;
      background: var(--bg-glass);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border-top: 1px solid var(--border-glass);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      color: var(--text-sub);
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      padding: 6px 12px;
      border-radius: var(--radius-md);
    }
    .nav-btn.active { color: var(--accent-color); }
    .nav-btn span { font-size: 18px; }

    .full-player {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: var(--bg-dark);
      z-index: 200;
      display: flex;
      flex-direction: column;
      padding: 20px;
      transform: translateY(100%);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .full-player.open { transform: translateY(0); }

    .fp-header { display: flex; justify-content: space-between; align-items: center; }
    
    .fp-cover-wrap { 
      width: 75vw; 
      max-width: 280px; 
      aspect-ratio: 1; 
      margin: 20px auto; 
      border-radius: var(--radius-xl); 
      overflow: hidden; 
      box-shadow: 0 20px 40px rgba(0,0,0,0.9), var(--glow-effect);
      border: 1px solid var(--border-glass);
      transition: transform 0.5s ease;
    }
    .fp-cover-wrap.playing {
      animation: pulseCover 2s infinite alternate ease-in-out;
    }
    @keyframes pulseCover {
      0% { transform: scale(1); }
      100% { transform: scale(1.03); }
    }

    .fp-cover { width: 100%; height: 100%; object-fit: cover; background: #111; }

    .fp-meta { text-align: center; margin-bottom: 20px; }
    .fp-title { font-size: 20px; font-weight: 800; color: #fff; margin-bottom: 4px; }
    .fp-artist { font-size: 14px; color: var(--text-sub); }

    .time-slider { 
      width: 100%; 
      -webkit-appearance: none; 
      height: 4px; 
      border-radius: 2px; 
      background: rgba(255,255,255,0.15); 
      outline: none;
      cursor: pointer;
    }
    .time-slider::-webkit-slider-thumb { 
      -webkit-appearance: none; 
      width: 14px; 
      height: 14px; 
      border-radius: 50%; 
      background: var(--accent-color); 
      box-shadow: var(--glow-effect);
    }

    .time-labels { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-sub); margin-top: 8px; }

    .fp-controls { display: flex; justify-content: space-between; align-items: center; margin: 24px 0; }
    .fp-btn { background: none; border: none; color: #fff; font-size: 22px; cursor: pointer; transition: transform 0.2s ease; opacity: 0.8; }
    .fp-btn:active { transform: scale(0.85); opacity: 1; }
    .fp-btn.active { color: var(--accent-color); opacity: 1; }

    .auth-card {
      background: var(--bg-glass-heavy);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-xl);
      padding: 20px;
      max-width: 480px;
      margin: 10px auto;
    }

    .cyber-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-glass);
      padding: 12px 14px;
      border-radius: var(--radius-md);
      color: #fff;
      font-size: 14px;
      margin-bottom: 12px;
      outline: none;
    }
    .cyber-input:focus { border-color: var(--accent-color); }

    .cyber-btn {
      width: 100%;
      padding: 14px;
      background: var(--accent-grad);
      border: none;
      border-radius: var(--radius-md);
      color: #000;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: all 0.2s ease;
    }
    .cyber-btn:active { transform: scale(0.97); }

    .admin-badge {
      background: #ff0055;
      color: #fff;
      padding: 2px 6px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 800;
      margin-left: 6px;
    }

    .file-dropzone {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 14px;
      background: rgba(255, 255, 255, 0.03);
      border: 2px dashed var(--border-glass);
      border-radius: var(--radius-md);
      font-size: 13px;
      color: var(--text-sub);
      margin-bottom: 12px;
      cursor: pointer;
    }

    .playlist-card {
      background: var(--bg-card);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-lg);
      padding: 14px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  </style>
</head>
<body>

  <div class="app-viewport">
    <div class="top-bar">
      <div class="top-header">
        <div class="logo">Mono.Music</div>
        <div class="user-pill" id="user-pill" onclick="switchTab('auth')">👤 Войти</div>
      </div>
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input class="search-input" id="search-bar" placeholder="Поиск по песням и артистам..." oninput="handleSearch(this.value)">
      </div>
    </div>

    <div class="content-area" id="main-content"></div>

    <!-- Мини-плеер -->
    <div class="mini-player" id="mini-player" style="display:none;" onclick="openFullPlayer()">
      <img class="mini-cover" id="m-cover" src="" onerror="handleCoverError(this)">
      <div style="flex:1; min-width:0;">
        <div class="row-title" id="m-title">-</div>
        <div class="row-artist" id="m-artist">-</div>
      </div>
      <button class="play-circle" id="m-play-btn" onclick="event.stopPropagation(); togglePlay()">▶</button>
    </div>

    <!-- Навигация -->
    <div class="bottom-bar" id="bottom-bar"></div>
  </div>

  <!-- Полноэкранный плеер -->
  <div class="full-player" id="full-player">
    <div class="fp-header">
      <button class="fp-btn" onclick="closeFullPlayer()">✕</button>
      <div style="font-size:12px; font-weight:800; color:var(--text-sub); letter-spacing:1px;">MONO PLAYER</div>
      <button class="icon-btn" id="fp-fav-btn" onclick="toggleFavCurrent()">♡</button>
    </div>
    
    <div class="fp-cover-wrap" id="fp-cover-wrap">
      <img class="fp-cover" id="fp-cover" src="" onerror="handleCoverError(this)">
    </div>

    <div class="fp-meta">
      <div class="fp-title" id="fp-title">-</div>
      <div class="fp-artist" id="fp-artist">-</div>
    </div>

    <div style="padding: 0 10px;">
      <input type="range" class="time-slider" id="fp-progress" value="0" min="0" max="100" oninput="seekAudio(this.value)">
      <div class="time-labels">
        <span id="fp-curr-time">0:00</span>
        <span id="fp-dur-time">0:00</span>
      </div>
    </div>

    <div class="fp-controls">
      <button class="fp-btn" id="btn-shuffle" onclick="toggleShuffle()">🔀</button>
      <button class="fp-btn" onclick="prevTrack()">⏮</button>
      <button class="play-circle" style="width:60px; height:60px; font-size:22px;" id="fp-play-btn" onclick="togglePlay()">▶</button>
      <button class="fp-btn" onclick="nextTrack()">⏭</button>
      <button class="fp-btn" id="btn-repeat" onclick="toggleRepeat()">🔁</button>
    </div>
  </div>

  <script>
    const audio = new Audio();
    audio.crossOrigin = "anonymous";

    const GITHUB_USER = 'bomba33345-sudo';
    const GITHUB_REPO = 'frame.github.io';
    const GITHUB_RAW_BASE = `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main/assets/`;
    const GITHUB_API_URL = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/assets`;
    const FALLBACK_COVER = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><rect width="100" height="100" fill="%23111"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="%23888" font-size="35">🎵</text></svg>';

    let db;
    let appState = {
      user: JSON.parse(localStorage.getItem('mono_user')) || null,
      currentTab: 'home',
      currentTrack: null,
      isPlaying: false,
      searchQuery: '',
      isShuffle: false,
      repeatMode: 0,
      theme: localStorage.getItem('mono_theme') || 'mono',
      favorites: JSON.parse(localStorage.getItem('mono_favs')) || [],
      playlists: JSON.parse(localStorage.getItem('mono_playlists')) || [],
      history: JSON.parse(localStorage.getItem('mono_history')) || [],
      tracks: [],
      adminSourceType: 'file'
    };

    if (appState.theme === 'cyber') document.body.classList.add('theme-cyber');

    /* INDEXEDDB STORAGE */
    function initDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open('MonoMusicDB', 1);
        request.onupgradeneeded = (e) => {
          const database = e.target.result;
          if (!database.objectStoreNames.contains('user_tracks')) {
            database.createObjectStore('user_tracks', { keyPath: 'id' });
          }
        };
        request.onsuccess = (e) => { db = e.target.result; resolve(); };
        request.onerror = (e) => reject(e);
      });
    }

    function saveTrackToDB(track) {
      return new Promise((resolve, reject) => {
        const store = db.transaction(['user_tracks'], 'readwrite').objectStore('user_tracks');
        const req = store.put(track);
        req.onsuccess = () => resolve();
        req.onerror = (e) => reject(e);
      });
    }

    function loadTracksFromDB() {
      return new Promise((resolve, reject) => {
        const store = db.transaction(['user_tracks'], 'readonly').objectStore('user_tracks');
        const req = store.getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = (e) => reject(e);
      });
    }

    function deleteTrackFromDB(id) {
      return new Promise((resolve) => {
        const store = db.transaction(['user_tracks'], 'readwrite').objectStore('user_tracks');
        store.delete(id);
        store.transaction.oncomplete = () => resolve();
      });
    }

    async function loadAllTracks() {
      let githubTracks = [];
      try {
        const res = await fetch(GITHUB_API_URL);
        if (res.ok) {
          const files = await res.json();
          const audioFiles = files.filter(f => f.name.endsWith('.mp3') || f.name.endsWith('.wav'));
          githubTracks = audioFiles.map((file, idx) => {
            const baseName = file.name.substring(0, file.name.lastIndexOf('.'));
            return {
              id: 'gh_' + idx,
              title: baseName.replace(/_/g, ' '),
              artist: 'GitHub Audio',
              src: file.download_url,
              cover: GITHUB_RAW_BASE + baseName + '.png',
              isCustom: false
            };
          });
        }
      } catch (e) {}

      const localTracks = await loadTracksFromDB();
      appState.tracks = [...localTracks, ...githubTracks];
      render();
    }

    function handleCoverError(img) { img.src = FALLBACK_COVER; }

    function handleSearch(val) {
      appState.searchQuery = val.toLowerCase().trim();
      render();
    }

    function render() {
      const view = document.getElementById('main-content');
      const userPill = document.getElementById('user-pill');
      
      userPill.innerHTML = appState.user ? 
        `👤 ${appState.user.name} ${appState.user.isAdmin ? '<span class="admin-badge">ADMIN</span>' : ''}` : '👤 Войти';

      document.getElementById('bottom-bar').innerHTML = `
        <div class="nav-btn ${appState.currentTab === 'home' ? 'active' : ''}" onclick="switchTab('home')"><span>⚡</span>Главная</div>
        <div class="nav-btn ${appState.currentTab === 'recs' ? 'active' : ''}" onclick="switchTab('recs')"><span>✨</span>Микс</div>
        <div class="nav-btn ${appState.currentTab === 'playlists' ? 'active' : ''}" onclick="switchTab('playlists')"><span>📁</span>Плейлисты</div>
        <div class="nav-btn ${appState.currentTab === 'favs' ? 'active' : ''}" onclick="switchTab('favs')"><span>❤️</span>Избранное</div>
        ${appState.user && appState.user.isAdmin ? `<div class="nav-btn ${appState.currentTab === 'admin' ? 'active' : ''}" onclick="switchTab('admin')"><span>⚙️</span>Админ</div>` : ''}
        <div class="nav-btn ${appState.currentTab === 'auth' ? 'active' : ''}" onclick="switchTab('auth')"><span>👤</span>Профиль</div>
      `;

      let filteredTracks = appState.tracks.filter(t => 
        t.title.toLowerCase().includes(appState.searchQuery) || 
        t.artist.toLowerCase().includes(appState.searchQuery)
      );

      if (appState.currentTab === 'home') {
        view.innerHTML = `<div class="section-head">🔥 Все треки (${filteredTracks.length})</div>${renderTrackRows(filteredTracks)}`;
      } 
      else if (appState.currentTab === 'recs') {
        // Простые рекомендации на основе лайков
        const recs = appState.tracks.filter(t => appState.favorites.includes(t.id) || Math.random() > 0.5);
        view.innerHTML = `<div class="section-head">✨ Персональные рекомендации</div>${renderTrackRows(recs)}`;
      }
      else if (appState.currentTab === 'playlists') {
        view.innerHTML = `
          <div class="section-head">📁 Мои плейлисты</div>
          <button class="cyber-btn" style="margin-bottom:14px;" onclick="createPlaylist()">➕ Создать плейлист</button>
          ${appState.playlists.map(p => `
            <div class="playlist-card">
              <div>
                <div style="font-weight:bold; font-size:15px;">${p.name}</div>
                <div style="font-size:12px; color:var(--text-sub);">${p.trackIds.length} треков</div>
              </div>
              <button class="icon-btn" onclick="deletePlaylist('${p.id}')">🗑️</button>
            </div>
          `).join('') || '<div style="color:var(--text-sub); text-align:center;">Плейлистов пока нет</div>'}
        `;
      }
      else if (appState.currentTab === 'favs') {
        const favs = filteredTracks.filter(t => appState.favorites.includes(t.id));
        view.innerHTML = `<div class="section-head">❤️ Избранные треки (${favs.length})</div>${renderTrackRows(favs)}`;
      }
      else if (appState.currentTab === 'auth') {
        view.innerHTML = appState.user ? `
          <div class="auth-card">
            <h2>Профиль: ${appState.user.name}</h2>
            <p style="color:var(--text-sub); margin:8px 0 16px 0;">Статус: ${appState.user.isAdmin ? 'Администратор ⚡' : 'Обычный слушатель 🎧'}</p>
            <button class="cyber-btn" style="margin-bottom:10px;" onclick="toggleTheme()">🎨 Сменить тему (Текущая: ${appState.theme.toUpperCase()})</button>
            <button class="cyber-btn" style="background:#ff0055; color:#fff;" onclick="logout()">Выйти из аккаунта</button>
          </div>
        ` : `
          <div class="auth-card">
            <h2 style="margin-bottom:14px; text-align:center;">Вход</h2>
            <input class="cyber-input" id="auth-name" placeholder="Логин (например: admin)">
            <input class="cyber-input" type="password" id="auth-pass" placeholder="Пароль">
            <button class="cyber-btn" onclick="login()">Войти</button>
          </div>
        `;
      }
      else if (appState.currentTab === 'admin') {
        view.innerHTML = `
          <div class="auth-card">
            <h2>⚙️ Панель управления треками</h2>
            <p style="color:var(--text-sub); font-size:12px; margin-bottom:14px;">Только администратор может добавлять и удалять треки</p>
            <input class="cyber-input" id="adm-title" placeholder="Название трека *">
            <input class="cyber-input" id="adm-artist" placeholder="Исполнитель">
            <div class="file-dropzone" onclick="document.getElementById('adm-audio-file').click()">
              🎵 Выбрать MP3/WAV файл
              <input type="file" id="adm-audio-file" accept="audio/*" style="display:none;">
            </div>
            <div class="file-dropzone" onclick="document.getElementById('adm-cover-file').click()">
              🖼️ Выбрать обложку (опционально)
              <input type="file" id="adm-cover-file" accept="image/*" style="display:none;">
            </div>
            <button class="cyber-btn" onclick="adminAddTrack()">Опубликовать трек</button>
          </div>
        `;
      }
    }

    function renderTrackRows(list) {
      if (!list.length) return `<div style="color:var(--text-sub); text-align:center; padding:30px;">Треки не найдены</div>`;
      return list.map(t => `
        <div class="track-row ${appState.currentTrack && appState.currentTrack.id === t.id ? 'active' : ''}" onclick="playTrack('${t.id}')">
          <img class="row-cover" src="${t.cover}" onerror="handleCoverError(this)">
          <div class="row-meta">
            <div class="row-title">${t.title}</div>
            <div class="row-artist">${t.artist}</div>
          </div>
          <!-- ИСПРАВЛЕН БАГ: Кнопка удаления видна ТОЛЬКО админу -->
          ${(appState.user && appState.user.isAdmin && t.isCustom) ? `
            <button class="icon-btn" style="color:#ff3366;" onclick="event.stopPropagation(); removeCustomTrack('${t.id}')">🗑️</button>
          ` : ''}
          <button class="icon-btn ${appState.favorites.includes(t.id) ? 'active' : ''}" onclick="event.stopPropagation(); toggleFav('${t.id}')">
            ${appState.favorites.includes(t.id) ? '❤️' : '♡'}
          </button>
        </div>
      `).join('');
    }

    function playTrack(id) {
      const t = appState.tracks.find(x => x.id === id);
      if (!t) return;
      appState.currentTrack = t;
      audio.src = t.src;
      
      audio.play().then(() => {
        appState.isPlaying = true;
        updatePlayerUI();
      }).catch(e => alert("Ошибка при воспроизведении"));
    }

    function togglePlay() {
      if (!appState.currentTrack && appState.tracks.length) return playTrack(appState.tracks[0].id);
      if (!appState.currentTrack) return;

      if (appState.isPlaying) { audio.pause(); appState.isPlaying = false; }
      else { audio.play(); appState.isPlaying = true; }
      updatePlayerUI();
    }

    function nextTrack() {
      if (!appState.tracks.length) return;
      if (appState.isShuffle) {
        const randomIdx = Math.floor(Math.random() * appState.tracks.length);
        return playTrack(appState.tracks[randomIdx].id);
      }
      const idx = appState.tracks.findIndex(t => t.id === (appState.currentTrack ? appState.currentTrack.id : ''));
      playTrack(appState.tracks[(idx + 1) % appState.tracks.length].id);
    }

    function prevTrack() {
      if (!appState.tracks.length) return;
      const idx = appState.tracks.findIndex(t => t.id === (appState.currentTrack ? appState.currentTrack.id : ''));
      playTrack(appState.tracks[(idx - 1 + appState.tracks.length) % appState.tracks.length].id);
    }

    function toggleShuffle() {
      appState.isShuffle = !appState.isShuffle;
      document.getElementById('btn-shuffle').classList.toggle('active', appState.isShuffle);
    }

    function toggleRepeat() {
      appState.repeatMode = (appState.repeatMode + 1) % 2;
      document.getElementById('btn-repeat').classList.toggle('active', appState.repeatMode === 1);
    }

    function updatePlayerUI() {
      if (!appState.currentTrack) return;
      document.getElementById('mini-player').style.display = 'flex';
      document.getElementById('m-cover').src = appState.currentTrack.cover;
      document.getElementById('m-title').textContent = appState.currentTrack.title;
      document.getElementById('m-artist').textContent = appState.currentTrack.artist;
      document.getElementById('m-play-btn').textContent = appState.isPlaying ? '⏸' : '▶';

      document.getElementById('fp-cover').src = appState.currentTrack.cover;
      document.getElementById('fp-title').textContent = appState.currentTrack.title;
      document.getElementById('fp-artist').textContent = appState.currentTrack.artist;
      document.getElementById('fp-play-btn').textContent = appState.isPlaying ? '⏸' : '▶';

      const wrap = document.getElementById('fp-cover-wrap');
      if (appState.isPlaying) wrap.classList.add('playing');
      else wrap.classList.remove('playing');

      const favBtn = document.getElementById('fp-fav-btn');
      favBtn.classList.toggle('active', appState.favorites.includes(appState.currentTrack.id));
      favBtn.textContent = appState.favorites.includes(appState.currentTrack.id) ? '❤️' : '♡';

      render();
    }

    function fileToBase64(file) {
      return new Promise((res, rej) => {
        const r = new FileReader();
        r.readAsDataURL(file);
        r.onload = () => res(r.result);
        r.onerror = e => rej(e);
      });
    }

    async function adminAddTrack() {
      if (!appState.user || !appState.user.isAdmin) return alert("Недостаточно прав!");
      
      const title = document.getElementById('adm-title').value.trim();
      const artist = document.getElementById('adm-artist').value.trim() || 'Неизвестен';
      if (!title) return alert('Укажите название трека!');

      const aFile = document.getElementById('adm-audio-file').files[0];
      const cFile = document.getElementById('adm-cover-file').files[0];
      if (!aFile) return alert('Выберите аудиофайл!');

      const src = await fileToBase64(aFile);
      const cover = cFile ? await fileToBase64(cFile) : FALLBACK_COVER;

      const newTrack = { id: 'local_' + Date.now(), title, artist, src, cover, isCustom: true };
      await saveTrackToDB(newTrack);
      appState.tracks.unshift(newTrack);
      playTrack(newTrack.id);
      switchTab('home');
    }

    // Защищенное удаление треков
    async function removeCustomTrack(id) {
      if (!appState.user || !appState.user.isAdmin) {
        return alert("Ошибки прав: удалять песни могут только администраторы!");
      }
      if (confirm('Вы уверены, что хотите удалить эту песню?')) {
        await deleteTrackFromDB(id);
        appState.tracks = appState.tracks.filter(t => t.id !== id);
        render();
      }
    }

    function createPlaylist() {
      const name = prompt("Введите название плейлиста:");
      if (name) {
        appState.playlists.push({ id: 'pl_' + Date.now(), name, trackIds: [] });
        localStorage.setItem('mono_playlists', JSON.stringify(appState.playlists));
        render();
      }
    }

    function deletePlaylist(id) {
      appState.playlists = appState.playlists.filter(p => p.id !== id);
      localStorage.setItem('mono_playlists', JSON.stringify(appState.playlists));
      render();
    }

    function toggleTheme() {
      appState.theme = appState.theme === 'mono' ? 'cyber' : 'mono';
      localStorage.setItem('mono_theme', appState.theme);
      if (appState.theme === 'cyber') document.body.classList.add('theme-cyber');
      else document.body.classList.remove('theme-cyber');
      render();
    }

    audio.ontimeupdate = () => {
      if (!audio.duration) return;
      document.getElementById('fp-progress').value = (audio.currentTime / audio.duration) * 100;
      document.getElementById('fp-curr-time').textContent = formatTime(audio.currentTime);
      document.getElementById('fp-dur-time').textContent = formatTime(audio.duration);
    };

    audio.onended = () => {
      if (appState.repeatMode === 1) { audio.currentTime = 0; audio.play(); }
      else { nextTrack(); }
    };

    function seekAudio(v) { if (audio.duration) audio.currentTime = (v / 100) * audio.duration; }
    function formatTime(s) { const m = Math.floor(s/60), sec = Math.floor(s%60); return `${m}:${sec<10?'0':''}${sec}`; }

    function openFullPlayer() { document.getElementById('full-player').classList.add('open'); }
    function closeFullPlayer() { document.getElementById('full-player').classList.remove('open'); }

    function toggleFav(id) {
      const idx = appState.favorites.indexOf(id);
      if (idx > -1) appState.favorites.splice(idx, 1);
      else appState.favorites.push(id);
      localStorage.setItem('mono_favs', JSON.stringify(appState.favorites));
      render();
    }
    function toggleFavCurrent() { if (appState.currentTrack) toggleFav(appState.currentTrack.id); }

    function switchTab(t) { appState.currentTab = t; render(); }

    function login() {
      const u = document.getElementById('auth-name').value.trim();
      const p = document.getElementById('auth-pass').value.trim();
      if (!u) return alert('Введите логин!');
      appState.user = { name: u, isAdmin: (u === 'admin' && p === 'admin123') };
      localStorage.setItem('mono_user', JSON.stringify(appState.user));
      render();
    }
    function logout() { appState.user = null; localStorage.removeItem('mono_user'); switchTab('home'); }

    initDB().then(() => loadAllTracks());
  </script>
</body>
</html>
